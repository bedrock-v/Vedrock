# Auto-labels PRs by changed path. Rules live in .github/labeler.yml.
name: Labeler

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply labels
    runs-on: ubuntu-latest
    steps:
      - name: Generate bot token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.VEDROCK_BOT_APP_ID }}
          private-key: ${{ secrets.VEDROCK_BOT_PRIVATE_KEY }}

      - name: Label PR
        uses: actions/labeler@v7
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
