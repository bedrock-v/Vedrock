name: CI

on:
  push:
    branches:
      - stable
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Check, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup V
        uses: ./.github/actions/setup-v

      # yeah, V's module cache serves leveldb back with "ambiguous selective
      # import" errors once it's warm, so every step after the first would fail.
      - name: Check
        run: v -nocache -check .

      - name: Test
        run: v -nocache test .

      - name: Build
        run: v -nocache -o vedrock .
