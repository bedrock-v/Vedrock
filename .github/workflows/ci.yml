name: CI

on:
  push:
    branches:
      - stable
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Check, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup V
        uses: ./.github/actions/setup-v

      - name: Check
        run: v -check .

      - name: Check for interface-narrowing codegen hazard
        run: python3 scripts/check_interface_narrowing.py server

      - name: Test
        run: v test .

      - name: Build
        run: v -o vedrock . # or i will use main.v if it gives any error
