name: CI

on:
  push:
    branches:
      - stable
      - dev
      - rewrite # for now
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Check, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup V
        uses: ./.github/actions/setup-v

      - name: Check
        run: v -check .

      - name: Test
        run: v test .

      - name: Build
        run: v -o vedrock .
