name: Setup V
description: Build the pinned V compiler (0.5.2 @ 7395646, vc @ dff9122) and install module dependencies

runs:
  using: composite
  steps:
    - name: Cache V compiler
      id: cache-v
      uses: actions/cache@v4
      with:
        path: ~/vlang
        key: vlang-7395646-dff9122-${{ runner.os }}

    - name: Build pinned V
      if: steps.cache-v.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone --filter=blob:none https://github.com/vlang/v ~/vlang
        cd ~/vlang
        git checkout 7395646
        git clone --filter=blob:none https://github.com/vlang/vc vc
        git -C vc checkout dff9122
        git clone --depth 1 --branch thirdparty-linux-amd64 https://github.com/vlang/tccbin thirdparty/tcc
        make local=1

    - name: Add V to PATH
      shell: bash
      run: |
        echo "$HOME/vlang" >> "$GITHUB_PATH"
        ~/vlang/v version

    - name: Install module dependencies
      shell: bash
      run: |
        ~/vlang/v install
