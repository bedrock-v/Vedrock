name: Setup V
description: Build the pinned V compiler (0.5.2 @ d5c6067, vc @ 84d9186) and install module dependencies

runs:
  using: composite
  steps:
    - name: Cache V compiler
      id: cache-v
      uses: actions/cache@v4
      with:
        path: ~/vlang
        key: vlang-d5c6067-84d9186-${{ runner.os }}

    - name: Build pinned V
      if: steps.cache-v.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone --filter=blob:none https://github.com/vlang/v ~/vlang
        cd ~/vlang
        git checkout d5c6067
        git clone --filter=blob:none https://github.com/vlang/vc vc
        git -C vc checkout 84d9186
        git clone --depth 1 --branch thirdparty-linux-amd64 https://github.com/vlang/tccbin thirdparty/tcc
        make local=1

    - name: Add V to PATH
      shell: bash
      run: |
        echo "$HOME/vlang" >> "$GITHUB_PATH"
        ~/vlang/v version

    - name: Install module dependencies
      shell: bash
      run: |
        deps="$HOME/vedrock-deps"
        vmod="$HOME/.vmodules"

        rm -rf "$deps" \
          "$vmod/nethernet" \
          "$vmod/webrtc" \
          "$vmod/nbt" \
          "$vmod/protocol"

        mkdir -p "$deps" "$vmod"

        git clone --depth 1 https://github.com/bedrock-v/nethernet "$deps/nethernet"
        git clone --depth 1 https://github.com/bedrock-v/webrtc-v "$deps/webrtc"
        git clone --depth 1 https://github.com/bedrock-v/nbt "$deps/nbt"
        git clone --depth 1 https://github.com/bedrock-v/protocol "$deps/protocol"
        git clone --depth 1 https://github.com/vlang/leveldb "$deps/leveldb"

        cp -a "$deps/nethernet" "$vmod/nethernet"
        cp -a "$deps/webrtc" "$vmod/webrtc"
        cp -a "$deps/nbt" "$vmod/nbt"
        cp -a "$deps/protocol/src" "$vmod/protocol"
        cp -a "$deps/leveldb" "$vmod/leveldb"

        ~/vlang/v install nepinhum.i18n
